<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#f7f6f3" />
  <title>청첩장 만들기 · 청첩장 스튜디오</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Playfair+Display:wght@600&display=swap" />
  <link rel="stylesheet" href="../src/builder/builder.css" />
</head>
<body class="b">
  <div id="builder" class="builder"><p class="boot">불러오는 중…</p></div>
  <script type="module">
    import { start } from '../src/builder/editor.js';
    start().catch((e) => {
      document.getElementById('builder').innerHTML = '<p class="boot">편집기를 열지 못했어요. 새로고침해 주세요.<br><small></small></p>';
      document.querySelector('.boot small').textContent = e.message;
      console.error(e);
    });
  </script>
</body>
</html>
